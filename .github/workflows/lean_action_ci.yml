name: Lean Action CI with Real Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lean-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the pinned Lean toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'

      - name: Build and test the pinned Lean project
        run: |
          lake --wfail build
          lake exe test_suite
          lake env lean FloatCounterexamples.lean

      - name: Setup Python for Lean verification
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist
          pip install numpy scipy matplotlib seaborn plotly rich pandas sympy networkx
          python -m pip install -e .

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run comprehensive Lean verification tests
        run: |
          echo "🚀 Running Comprehensive Lean Verification Tests"
          python3 src/tests/run_comprehensive_lean_tests.py --output-file lean_action_test_report.json

      - name: Run Lean examples with verification
        run: |
          echo "🔬 Testing Lean examples for real functionality"
          # Test each example individually to catch specific issues
          echo "Testing statistical analysis example..."
          mkdir -p "outputs/ci-examples/statistical_analysis"
          (cd "outputs/ci-examples/statistical_analysis" && PYTHONPATH="$GITHUB_WORKSPACE" python3 "$GITHUB_WORKSPACE/examples/statistical_analysis_example.py")

          echo "Testing dynamical systems example..."
          mkdir -p "outputs/ci-examples/dynamical_systems"
          (cd "outputs/ci-examples/dynamical_systems" && PYTHONPATH="$GITHUB_WORKSPACE" python3 "$GITHUB_WORKSPACE/examples/dynamical_systems_example.py")

          echo "Testing control theory example..."
          mkdir -p "outputs/ci-examples/control_theory"
          (cd "outputs/ci-examples/control_theory" && PYTHONPATH="$GITHUB_WORKSPACE" python3 "$GITHUB_WORKSPACE/examples/control_theory_example.py")

          echo "Testing integration showcase..."
          mkdir -p "outputs/ci-examples/integration_showcase"
          (cd "outputs/ci-examples/integration_showcase" && PYTHONPATH="$GITHUB_WORKSPACE" python3 "$GITHUB_WORKSPACE/examples/integration_showcase_example.py")

      - name: Upload Lean verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-action-test-report
          path: lean_action_test_report.json

      - name: Upload example outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-action-example-outputs
          path: |
            outputs/ci-examples/**
            logs/**

      - name: Validate Lean functionality
        run: |
          echo "🔍 Validating Lean functionality..."
          if [ -f "lean_action_test_report.json" ]; then
            python3 -c "
          import json
          with open('lean_action_test_report.json') as f:
              data = json.load(f)
          success_rate = data['test_summary']['success_rate']
          print(f'Lean verification success rate: {success_rate:.1f}%')
          if success_rate == 100:
              print('✅ Qualified core compiler and runtime checks passed')
              exit(0)
          else:
              print('❌ Lean methods realness not sufficiently confirmed')
              exit(1)
          " || exit 1
          else
            echo "❌ Lean verification report not found"
            exit 1
          fi
      - name: Generate Lean action summary
        if: always()
        run: |
          echo "## 🔬 Lean Action CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "lean_action_test_report.json" ]; then
            python3 -c "
          import json
          with open('lean_action_test_report.json') as f:
              data = json.load(f)

          summary = data['test_summary']
          results = data['test_results']

          print(f'### 📊 Lean Verification Results')
          print(f'- **Total Tests**: {summary[\"total_tests\"]}')
          print(f'- **Passed**: {summary[\"passed\"]}')
          print(f'- **Failed**: {summary[\"failed\"]}')
          print(f'- **Success Rate**: {summary[\"success_rate\"]:.1f}%')
          print('')
          print('### 📋 Test Details')
          for test_name, success in results.items():
              status = '✅ PASSED' if success else '❌ FAILED'
              print(f'- {status}: {test_name}')
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Lean verification report not available" >> $GITHUB_STEP_SUMMARY
          fi

          # Check if examples generated outputs
          if [ -d "outputs" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📁 Example Outputs Generated" >> $GITHUB_STEP_SUMMARY
            find outputs -name "*.json" -o -name "*.lean" -o -name "*.png" | head -10 | while read file; do
              echo "- $file" >> $GITHUB_STEP_SUMMARY
            done
            if [ $(find outputs -type f | wc -l) -gt 10 ]; then
              echo "- ... and more files" >> $GITHUB_STEP_SUMMARY
            fi
          fi
