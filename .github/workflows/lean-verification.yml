name: Lean Verification on Push

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - 'src/lean/**'
      - 'src/python/core/**'
      - 'src/tests/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'lakefile.toml'
      - 'lean-toolchain'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/lean/**'
      - 'src/python/core/**'
      - 'src/tests/**'
      - 'examples/**'

permissions:
  contents: read

jobs:
  lean-verification-check:
    name: Lean Methods Realness Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-xdist numpy scipy matplotlib seaborn plotly rich pandas sympy networkx
        python -m pip install -e .

    - name: Set up the pinned Lean toolchain
      uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
      with:
        auto-config: 'false'
        build: 'false'
        test: 'false'
        lint: 'false'
        use-mathlib-cache: 'false'

    - name: Build Lean project
      run: |
        lake --wfail build
        lake exe test_suite
        lake env lean FloatCounterexamples.lean

    - name: Create logs directory
      run: mkdir -p logs

    - name: Run quick Lean verification
      run: |
        echo "🔬 Running Quick Lean Verification Check"
        timeout 300 python3 src/tests/run_comprehensive_lean_tests.py --no-logging --output-file quick_verification.json

    - name: Check Lean verification results
      run: |
        echo "🔍 Checking Lean verification results..."
        if [ -f "quick_verification.json" ]; then
          python3 -c "
        import builtins, os, re
        def _emit(value):
            line = str(value)
            if re.fullmatch(r'[A-Z][A-Z0-9_]*=[^\r\n]*', line):
                with open(os.environ['GITHUB_ENV'], 'a') as env_file:
                    env_file.write(line + '\n')
            else:
                builtins.print(line)

        import json
        import sys

        try:
            with open('quick_verification.json') as f:
                data = json.load(f)

            summary = data['test_summary']
            success_rate = summary['success_rate']

            _emit(f'Quick Lean verification success rate: {success_rate:.1f}%')

            # Require at least 40% success rate for basic functionality
            if success_rate == 100:
                _emit('✅ Basic Lean functionality confirmed')
                _emit(f'LEAN_BASIC_FUNCTIONAL=true')
                _emit(f'LEAN_SUCCESS_RATE={success_rate:.1f}')
                with open('verification_status.txt', 'w') as status_file:
                    status_file.write(f'BASIC_LEAN_FUNCTIONAL=true\n')
                    status_file.write(f'SUCCESS_RATE={success_rate:.1f}\n')
                    status_file.write(f'TOTAL_TESTS={summary[\"total_tests\"]}\n')
                    status_file.write(f'PASSED={summary[\"passed\"]}\n')
            else:
                _emit('❌ Basic Lean functionality not confirmed')
                _emit(f'LEAN_BASIC_FUNCTIONAL=false')
                with open('verification_status.txt', 'w') as status_file:
                    status_file.write(f'BASIC_LEAN_FUNCTIONAL=false\n')
                    status_file.write(f'SUCCESS_RATE={success_rate:.1f}\n')
                sys.exit(1)

        except Exception as e:
            _emit(f'Error parsing verification results: {e}')
            _emit('LEAN_BASIC_FUNCTIONAL=false')
            with open('verification_status.txt', 'w') as status_file:
                status_file.write(f'BASIC_LEAN_FUNCTIONAL=false\n')
                status_file.write(f'ERROR={e}\n')
            sys.exit(1)
        "
        else
          echo "❌ Verification report not found"
          echo "LEAN_BASIC_FUNCTIONAL=false" >> $GITHUB_ENV
          echo "BASIC_LEAN_FUNCTIONAL=false" > verification_status.txt
          exit 1
        fi
    - name: Upload verification status
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
      if: always()
      with:
        name: lean-verification-status
        path: verification_status.txt

    - name: Upload quick verification report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
      if: always()
      with:
        name: quick-verification-report
        path: quick_verification.json

    - name: Generate verification status comment
      if: always()
      run: |
        if [ -f "verification_status.txt" ]; then
          echo "## 🔬 Lean Verification Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          while IFS='=' read -r key value; do
            case $key in
              BASIC_LEAN_FUNCTIONAL)
                if [ "$value" = "true" ]; then
                  echo "✅ **Lean methods confirmed as real and functional**" >> $GITHUB_STEP_SUMMARY
                else
                  echo "❌ **Lean methods functionality not confirmed**" >> $GITHUB_STEP_SUMMARY
                fi
                ;;
              SUCCESS_RATE)
                echo "- **Success Rate**: $value%" >> $GITHUB_STEP_SUMMARY
                ;;
              TOTAL_TESTS)
                echo "- **Total Tests**: $value" >> $GITHUB_STEP_SUMMARY
                ;;
              PASSED)
                echo "- **Tests Passed**: $value" >> $GITHUB_STEP_SUMMARY
                ;;
              ERROR)
                echo "- **Error**: $value" >> $GITHUB_STEP_SUMMARY
                ;;
            esac
          done < verification_status.txt

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚨 Action Required" >> $GITHUB_STEP_SUMMARY
          if [ "$LEAN_BASIC_FUNCTIONAL" = "false" ]; then
            echo "- Lean methods realness not confirmed" >> $GITHUB_STEP_SUMMARY
            echo "- Check comprehensive CI logs for detailed analysis" >> $GITHUB_STEP_SUMMARY
            echo "- Review Lean code changes for compilation issues" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "❌ Verification status not available" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Fail if Lean verification failed
      if: env.LEAN_BASIC_FUNCTIONAL == 'false'
      run: |
        echo "❌ Lean verification failed - basic functionality not confirmed"
        exit 1
